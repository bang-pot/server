spring:
  datasource:
    url: ${BANGPOT_TEST_DB_URL:jdbc:tc:postgresql:17:///bangpot-test}
    driver-class-name: ${BANGPOT_TEST_DB_DRIVER:org.testcontainers.jdbc.ContainerDatabaseDriver}
    username: ${BANGPOT_TEST_DB_USERNAME:}
    password: ${BANGPOT_TEST_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  test:
    database:
      replace: none
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-kakao-client
            client-secret: test-kakao-secret
            client-authentication-method: client_secret_post
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
bangpot:
  auth:
    required-terms-version: 2026-03-25
    frontend:
      base-url: http://localhost:3000
    jwt:
      secret: test-secret-key-test-secret-key-test-secret-key-1234
      secure-cookie: false
  ops:
    environment-name: test
    slack:
      all-log-webhook-url: ""
      error-log-webhook-url: ""

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include: ping
        readiness:
          include: db

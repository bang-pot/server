spring:
  application:
    name: bangpot-backend
  profiles:
    default: local
  config:
    import:
      - optional:file:.env[.properties]
      - optional:classpath:application-local-secret.yml
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:kakao-client-id-not-configured}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: ${KAKAO_CLIENT_AUTHENTICATION_METHOD:client_secret_post}
            redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/login/oauth2/code/kakao}
            authorization-grant-type: authorization_code
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

bangpot:
  auth:
    required-terms-version: ${BANGPOT_AUTH_REQUIRED_TERMS_VERSION:2026-03-25}
    frontend:
      base-url: ${BANGPOT_AUTH_FRONTEND_BASE_URL:http://localhost:3000}
    jwt:
      issuer: ${BANGPOT_AUTH_JWT_ISSUER:bangpot}
      secret: ${BANGPOT_AUTH_JWT_SECRET:local-local-local-local-local-local-secret-12345}
      cookie-name: ${BANGPOT_AUTH_JWT_COOKIE_NAME:access_token}
      access-token-validity-seconds: ${BANGPOT_AUTH_JWT_ACCESS_TOKEN_VALIDITY_SECONDS:604800}
      secure-cookie: ${BANGPOT_AUTH_JWT_SECURE_COOKIE:false}

server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: bangpot-backend
  profiles:
    default: local
  config:
    import:
      - optional:file:.env[.properties]
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    driver-class-name: org.postgresql.Driver
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: banglog-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  datasource:
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: ${KAKAO_CLIENT_AUTHENTICATION_METHOD:client_secret_post}
            redirect-uri: ${KAKAO_REDIRECT_URI}
            authorization-grant-type: authorization_code
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

banglog:
  auth:
    required-terms-version: ${AUTH_REQUIRED_TERMS_VERSION}
    frontend:
      base-url: ${AUTH_FRONTEND_BASE_URL}
    jwt:
      issuer: ${AUTH_JWT_ISSUER:banglog}
      secret: ${AUTH_JWT_SECRET}
      cookie-name: ${AUTH_JWT_COOKIE_NAME:access_token}
      access-token-validity-seconds: ${AUTH_JWT_ACCESS_TOKEN_VALIDITY_SECONDS:604800}
      secure-cookie: ${AUTH_JWT_SECURE_COOKIE:true}
  ops:
    environment-name: ${OPS_ENVIRONMENT_NAME:default}
    slack:
      all-log-webhook-url: ${OPS_SLACK_ALL_LOG_WEBHOOK_URL:}
      error-log-webhook-url: ${OPS_SLACK_ERROR_LOG_WEBHOOK_URL:}
  storage:
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    s3:
      bucket: ${STORAGE_S3_BUCKET:}
      region: ${STORAGE_S3_REGION:${AWS_REGION:ap-northeast-2}}
      access-key: ${STORAGE_S3_ACCESS_KEY:}
      secret-key: ${STORAGE_S3_SECRET_KEY:}
  cache:
    redis:
      enabled: ${CACHE_REDIS_ENABLED:false}
      default-ttl: ${CACHE_REDIS_DEFAULT_TTL:5m}
      explore-theme-search-ttl: ${CACHE_REDIS_EXPLORE_THEME_SEARCH_TTL:60s}
      explore-filters-ttl: ${CACHE_REDIS_EXPLORE_FILTERS_TTL:6h}
      home-anonymous-ttl: ${CACHE_REDIS_HOME_ANONYMOUS_TTL:60s}
  idempotency:
    enabled: ${IDEMPOTENCY_ENABLED:true}
    header-name: ${IDEMPOTENCY_HEADER_NAME:Idempotency-Key}
    ttl: ${IDEMPOTENCY_TTL:30s}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include: ping
        readiness:
          include: db

server:
  port: ${SERVER_PORT:8080}

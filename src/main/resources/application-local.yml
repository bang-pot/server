spring:
  config:
    activate:
      on-profile: local
    import:
      - optional:classpath:application-local-secret.yml
  datasource:
    url: ${BANGLOG_DB_URL:jdbc:postgresql://localhost:5432/banglog_local}
    username: ${BANGLOG_DB_USERNAME:postgres}
    password: ${BANGLOG_DB_PASSWORD:${DB_PASSWORD:}}
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:kakao-client-id-not-configured}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: ${KAKAO_CLIENT_AUTHENTICATION_METHOD:client_secret_post}
            redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/login/oauth2/code/kakao}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

banglog:
  auth:
    required-terms-version: ${BANGLOG_AUTH_REQUIRED_TERMS_VERSION:2026-03-25}
    frontend:
      base-url: ${BANGLOG_AUTH_FRONTEND_BASE_URL:http://localhost:3000}
    jwt:
      secret: ${BANGLOG_AUTH_JWT_SECRET:local-local-local-local-local-local-secret-12345}
      secure-cookie: ${BANGLOG_AUTH_JWT_SECURE_COOKIE:false}
  ops:
    environment-name: local
  cache:
    redis:
      enabled: true

logging:
  level:
    root: INFO
    com.banglog: DEBUG
    org.hibernate.SQL: DEBUG
